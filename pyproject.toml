[project]
name = "pyfolioanalytics"
version = "0.3.0"
description = "High-fidelity Python implementation of R PortfolioAnalytics — portfolio optimisation, risk measures, and moment estimation with cross-validated mathematical parity."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "curry tang", email = "twn39@163.com" }
]
keywords = [
    "portfolio", "optimisation", "finance", "quantitative",
    "black-litterman", "risk", "cvxpy", "mean-variance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.12"
dependencies = [
    "clarabel>=0.9",
    "cvxopt>=1.3",
    "cvxpy>=1.6",
    "highspy>=1.7",
    "kaleido>=0.2",
    "networkx>=3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.0",
    "pyscipopt>=5.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/twn39/pyfolioanalytics"
Repository = "https://github.com/twn39/pyfolioanalytics"
"Bug Tracker" = "https://github.com/twn39/pyfolioanalytics/issues"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [
    "third_party/**",
    "GEMINI.md",
    "data/**",
    "scripts/**",
    "ANALYSIS_REPORT.md",
]

[dependency-groups]
dev = [
    "pyportfolioopt>=1.6.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.4",
    "ty>=0.0.31",
    "akshare>=1.18",
    "yfinance>=1.0",
    "riskfolio-lib>=7.0",
    "kaleido>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".*", "cvxopt", "cvxpy", "numpy", "pandas", "pyscipopt", "riskfolio-lib", "scikit-learn", "scipy", "yfinance"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable names (l, O, I) — common in finance math
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]  # allow unused imports and redefinitions in tests

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "src/pyfolioanalytics/dbht.py",  # legacy MATLAB-style code; no type annotations
]
